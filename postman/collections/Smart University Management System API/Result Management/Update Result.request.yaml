$kind: http-request
name: Update Result
description: Updates an existing result. Grade and grade point are recalculated automatically based on the updated marks.
url: "{{baseUrl}}/api/v1/results/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    description: The ID of the result.
  - key: result
    value: "1"
    description: Result ID.
body:
  type: json
  content: "{\r

    \    \"enrollment_id\": 1,\r

    \    \"student_id\": 1,\r

    \    \"semester_id\": 1,\r

    \    \"academic_session_id\": 1,\r

    \    \"remarks\": \"Updated semester result\",\r

    \    \"status\": true\r

    }"
examples: ./.resources/Update Result.resources/examples
order: 4000
