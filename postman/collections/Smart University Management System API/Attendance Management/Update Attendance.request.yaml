$kind: http-request
name: Update Attendance
description: Updates an existing attendance record.
url: "{{baseUrl}}/api/v1/attendances/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    description: The ID of the attendance.
  - key: attendance
    value: "1"
    description: Attendance ID.
body:
  type: json
  content: "{\r

    \    \"student_id\": 1,\r

    \    \"course_id\": 1,\r

    \    \"semester_id\": 1,\r

    \    \"routine_id\": 1,\r

    \    \"attendance_date\": \"2026-07-28\",\r

    \    \"status\": \"Present\",\r

    \    \"remarks\": \"Present in class\"\r

    }"
examples: ./.resources/Update Attendance.resources/examples
order: 4000
